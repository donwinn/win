<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jessibuca FLV 播放器 - 优化版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0e1a;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px;             
            overflow-y: auto;
        }

        .player-card {
            max-width: 1200px;
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: auto;
        }

        /* 播放区：按视口剩余高度反算宽度，竖屏比例不变但整体放大 */
        .video-area {
            position: relative;
            pointer-events: auto;
            width: min(500px, calc((100vh - 120px) * 430 / 800));
            aspect-ratio: 430 / 800;
            height: auto;
            min-width: 320px;
            margin: 0 auto;
            flex-shrink: 0;
        }

        #jessibuca-container {
            width: 100%;
            height: 100%;
        }

        /* —— 控件栏：紧凑化 —— */
        .controls-bar {
            background: rgba(16, 20, 30, 0.95);
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .url-input-wrapper {
            flex: 4;
            min-width: 200px;
            display: flex;
            background: #0f111a;
            border-radius: 40px;
            border: 1px solid #2a2f42;
            transition: all 0.2s;
        }

        .url-input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .url-label {
            padding: 0 12px;
            color: #8b95b5;
            font-size: 11px;
            font-weight: 500;
            line-height: 34px;
            background: #1a1e2c;
            border-radius: 40px 0 0 40px;
            border-right: 1px solid #2a2f42;
            white-space: nowrap;
        }

        .paste-label {
            padding: 0 12px;
            color: #8b95b5;
            font-size: 11px;
            font-weight: 500;
            line-height: 34px;
            background: #1a1e2c;
            border-radius: 0 40px 40px 0;
            border-left: 1px solid #2a2f42;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .paste-label:hover { background: #252b40; color: #cdd6f4; border-left-color: #3e455e; }
        .paste-label:active { background: #10141f; transform: scale(0.97); }

        #streamUrl {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0 10px;
            height: 34px;
            color: #f0f3fa;
            font-size: 12px;
            font-family: monospace;
            outline: none;
            min-width: 0;
        }

        #streamUrl::placeholder { color: #4a516e; font-family: system-ui; }

        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }

        .btn {
            padding: 0 14px;
            height: 34px;
            border-radius: 34px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #1e2538;
            color: #e2e8ff;
            border: 1px solid #323a52;
        }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; transform: scale(0.97); }
        .btn-danger { background: #dc2626; border-color: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-warning { background: #f59e0b; border-color: #f59e0b; color: #1e1b12; }

        .btn-warning.is-muted {
            background: #78350f;
            border-color: #92400e;
            color: #fde68a;
        }

        .status-area {
            background: #0b0e16;
            border-radius: 30px;
            padding: 3px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            border: 1px solid #292f42;
        }

        .led { width: 8px; height: 8px; border-radius: 10px; background: #5b6380; }
        .led.green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .led.red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .led.yellow { background: #eab308; box-shadow: 0 0 6px #eab308; }

        .status-text { color: #bfc9f0; font-family: monospace; }

        .footer-tip {
            font-size: 10px;
            text-align: center;
            padding: 6px 10px;
            color: #5a6382;
            background: #05070c;
            border-top: 1px solid #181e2c;
            line-height: 1.5;
        }

        .toast-message {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e253ecc;
            backdrop-filter: blur(12px);
            color: #c0d0ff;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #3d4570;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            font-family: monospace;
            max-width: 90vw;
            word-break: break-all;
            text-align: center;
            line-height: 1.6;
        }

        .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 700px) {
            .controls-bar { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: center; }
            .toast-message { font-size: 11px; bottom: 60px; }
        }

        /* 手机等窄屏：让视频区域铺满宽度，比例保持 */
        @media (max-width: 480px) {
            .video-area {
                width: 100%;
                min-width: 0;
                height: auto;
                aspect-ratio: 430 / 800;
            }
        }
    </style>
    <link rel="icon" href="data:,">
</head>
<body>

<div class="player-card">
    <div class="video-area">
        <div id="jessibuca-container"></div>
    </div>

    <div class="controls-bar">
        <div class="url-input-wrapper">
            <span class="url-label">🎬 播放地址</span>
            <input type="text" id="streamUrl" placeholder="例如: http://xxx.xxx/live/stream.flv 或 ws://..." value="">
            <span class="paste-label" id="pasteUrlBtn">粘贴地址</span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="playBtn">▶ 播放</button>
            <button class="btn btn-danger" id="stopBtn">⏹ 停止</button>
            <button class="btn btn-warning" id="muteBtn">🔇 静音</button>
            <button class="btn" id="diagBtn">🔍 检测</button>
        </div>
        <div class="status-area">
            <div class="led" id="statusLed"></div>
            <span class="status-text" id="statusMsg">待机</span>
        </div>
    </div>

    <div class="footer-tip">
        📌 支持 FLV (HTTP/HTTPS/WS) ｜ 解码器: jessibuca + decoder.wasm<br>
        💡 报 fetchError 时先点「检测」，它会告诉你到底是 403 过期、404 写错，还是跨域被拦
    </div>
</div>

<div id="toastMsg" class="toast-message">提示信息</div>

<script src="./js/jessibuca_v3.3.21.js"></script>
<script>
(function () {
    'use strict';

    /* ================= 配置区 ================= */
    var CFG = {
        decoderJs: './js/decoder.js',
        decodingDir: './js/',
        maxRetry: 3,
        probeTimeout: 8000,
        rebuildGap: 100,
        audioWait: 3000,
        storeKey: 'jessibuca_last_url',
        storeMute: 'jessibuca_muted',
        BeforVolume: null
    };

    /* ================= DOM ================= */
    function $(id) { return document.getElementById(id); }

    var videoArea   = document.querySelector('.video-area');
    var containerEl = $('jessibuca-container');
    var urlInput    = $('streamUrl');
    var playBtn     = $('playBtn');
    var stopBtn     = $('stopBtn');
    var muteBtn     = $('muteBtn');
    var diagBtn     = $('diagBtn');
    var statusLed   = $('statusLed');
    var statusMsg   = $('statusMsg');
    var toastEl     = $('toastMsg');
    var pasteBtn    = $('pasteUrlBtn');

    /* ================= 状态 ================= */
    var player     = null;
    var currentUrl = '';
    var muted      = true;
    var manualStop = false;
    var retryTimer = null;
    var retryCount = 0;
    var toastTimer = null;
    var playSeq    = 0;
    var hasAudio   = null;
    var audioTimer = null;

    var ERR_TEXT = {
        playError:                 ['地址为空',         '调用 play() 时 URL 是空的'],
        fetchError:                ['HTTP 拉流失败',    '多为跨域未放行、auth_key 过期(403) 或地址不可达'],
        websocketError:            ['WS 拉流失败',      'ws/wss 地址错误，或服务端拒绝握手'],
        httpError:                 ['HTTP 状态异常',    '服务器返回了非 2xx 状态码'],
        wasmDecodeError:           ['软解失败',         '码流编码不受支持，或 decoder.wasm 没加载到'],
        mediaSourceH265NotSupport: ['MSE 不支持 H.265', '浏览器 MSE 解不了 H.265'],
        webcodecsH265NotSupport:   ['硬解不支持 H.265', '当前浏览器 WebCodecs 不支持 H.265'],
        webcodecsDecodeError:      ['硬解失败',         '正常应自动降级软解，仍失败请查码流'],
        notSupported:              ['格式不支持',       '容器或编码不被支持'],
        unknown:                   ['未知错误',         '打开 F12 控制台看详细日志']
    };

    var NET_ERRORS = ['fetchError', 'websocketError', 'httpError'];

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function tip(msg, isError) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.style.background  = isError ? '#dc2626cc' : '#1e253ecc';
        toastEl.style.color       = isError ? '#fff0e0' : '#c0d0ff';
        toastEl.style.borderColor = isError ? '#ff8a6f' : '#3d4570';
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, isError ? 4500 : 2200);
    }

    function setStatus(state, msg) {
        statusMsg.textContent = msg;
        statusLed.className = 'led';
        if (state === 'connecting') statusLed.classList.add('yellow');
        else if (state === 'playing') statusLed.classList.add('green');
        else if (state === 'error') statusLed.classList.add('red');
    }

    function freshContainer() {
        var old = document.getElementById('jessibuca-container');
        var next = document.createElement('div');
        next.id = 'jessibuca-container';
        next.style.width = '100%';
        next.style.height = '100%';

        if (old && old.parentNode) {
            old.parentNode.replaceChild(next, old);
        } else if (videoArea) {
            videoArea.appendChild(next);
        }
        containerEl = next;
        return next;
    }

    function showPlaceholder(text) {
        if (!containerEl) freshContainer();
        containerEl.innerHTML = '';
        var box = document.createElement('div');
        box.style.cssText = 'width:100%;height:100%;background:#0a0e18;display:flex;' +
            'align-items:center;justify-content:center;flex-direction:column;gap:12px;' +
            'color:#6a729b;font-size:14px;text-align:center;padding:24px;line-height:1.8;';
        box.innerHTML = '<div style="font-size:48px;">📺</div>' +
            '<div>' + (text || '等待播放') + '</div>' +
            '<div style="font-size:11px;">Jessibuca 解码器待命</div>';
        containerEl.appendChild(box);
    }

    function hardReset() {
        clearTimeout(retryTimer);
        retryTimer = null;
        clearTimeout(audioTimer);
        audioTimer = null;
        hasAudio = null;

        if (player) {
            try { if (typeof player.pause === 'function') player.pause(); } catch (e) {}
            try { player.destroy(); } catch (e) { console.warn('destroy 异常', e); }
            player = null;
        }
        if (containerEl) containerEl.innerHTML = '';
    }

    function parseAuthKey(url) {
        var m = /[?&]auth_key=(\d{10})-/i.exec(url);
        if (!m) return null;
        var ts = Number(m[1]) * 1000;
        var d = new Date(ts);
        var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        return {
            ts: ts,
            expired: Date.now() > ts,
            text: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                  ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
        };
    }

    function probeStream(url) {
        var ac = new AbortController();
        var timer = setTimeout(function () { ac.abort(); }, CFG.probeTimeout);
        return fetch(url, {
            method: 'GET', mode: 'cors', cache: 'no-store',
            credentials: 'omit', signal: ac.signal
        }).then(function (res) {
            var info = {
                ok: res.ok, status: res.status,
                contentType: res.headers.get('content-type') || ''
            };
            ac.abort();
            return info;
        }).catch(function (err) {
            return {
                ok: false, status: 0,
                netError: (err && err.name ? err.name : 'Error') + ': ' + (err && err.message ? err.message : '')
            };
        }).then(function (r) { clearTimeout(timer); return r; });
    }

    function explainProbe(r, url) {
        if (r.status === 200) {
            return { ok: true, msg: '服务器返回 200，跨域也放行了。地址本身没问题，可点播放。' +
                (r.contentType ? '（Content-Type: ' + r.contentType + '）' : '') };
        }
        if (r.status === 401 || r.status === 403) {
            var tk = parseAuthKey(url);
            return { ok: false, msg: '服务器返回 ' + r.status + '，链接被拒绝。' +
                (tk ? 'auth_key 过期时间为 ' + tk.text +
                    (tk.expired ? '，已经过期，请回平台重新生成！' : '，尚未过期，检查签名/防盗链/白名单。') : '') };
        }
        if (r.status === 404) {
            return { ok: false, msg: '服务器返回 404，路径写错了，检查设备号、_b3 后缀和端口。' };
        }
        if (r.status === 0 && r.netError) {
            return { ok: false, msg: '请求在浏览器层就失败了（' + r.netError + '）。' +
                '典型原因是跨域未放行或协议不一致（https 页面拉 http 流）。需用本地代理绕过。' };
        }
        return { ok: false, msg: '返回状态 ' + r.status + '，请对照 F12 Network 面板确认。' };
    }

    async function diagnose() {
        var url = urlInput.value.trim();
        if (!url) { tip('先填一个流地址再检测', true); return; }

        var tk = parseAuthKey(url);
        if (tk && tk.expired) tip('⚠️ auth_key 已于 ' + tk.text + ' 过期，这条链接必定失败', true);

        setStatus('connecting', '检测中...');
        tip('正在探测服务器响应头，请稍候...');
        diagBtn.disabled = true;
        try {
            var r = await probeStream(url);
            console.log('[probe]', url, r);
            var e = explainProbe(r, url);
            tip(e.msg, !e.ok);
            setStatus(e.ok ? 'idle' : 'error', e.ok ? '地址可用' : '检测未通过');
        } finally {
            diagBtn.disabled = false;
        }
    }

    function normalizeError(err) {
        if (!err) return { type: 'unknown', raw: '' };
        if (typeof err === 'string') return { type: err, raw: err };
        return {
            type: err.type || err.name || err.errorType || 'unknown',
            raw: err.message || err.msg || JSON.stringify(err)
        };
    }

    function handleError(err) {
        var info = normalizeError(err);
        var dict = ERR_TEXT[info.type] || ERR_TEXT.unknown;
        console.error('[jessibuca error]', info.type, err);

        setStatus('error', dict[0]);
        var extra = '';
        if (info.type === 'fetchError') {
            extra = ' 排查顺序：① 重新生成链接（auth_key 会过期）② 用「检测」看是否跨域 ③ 本地代理绕过';
        }
        tip('❌ ' + dict[0] + '：' + dict[1] + extra, true);

        if (NET_ERRORS.indexOf(info.type) >= 0 && !manualStop) scheduleRetry();
    }

    function scheduleRetry() {
        if (retryCount >= CFG.maxRetry) {
            setStatus('error', '重连已达上限');
            tip('已重试 ' + CFG.maxRetry + ' 次仍未成功，请先点「检测」确认链接状态', true);
            return;
        }
        retryCount++;
        var delay = Math.min(1000 * Math.pow(2, retryCount - 1), 8000);
        setStatus('connecting', (delay / 1000) + 's 后重连 (' + retryCount + '/' + CFG.maxRetry + ')');
        clearTimeout(retryTimer);
        retryTimer = setTimeout(function () {
            if (!manualStop && currentUrl) startPlay(currentUrl, true);
        }, delay);
    }

    function applyMute(want) {
        if (!player) return false;

        var ok = false;
        try {
            if (want) {
                if (player.player.volume !== 0) {CFG.BeforVolume = Number(player.player.volume.toFixed(2))}
                if (typeof player.mute === 'function') { player.mute(); ok = true; }
            } else {
                if (typeof player.cancelMute === 'function') { player.cancelMute(); ok = true; }
                if (typeof player.audioResume === 'function') { player.audioResume(); }
                if (typeof player.setVolume === 'function') { player.setVolume(CFG.BeforVolume||0.5); ok = true; }
            }
        } catch (e) {
            console.warn('切换音量异常', e);
        }
        return ok;
    }

    function readRealMute() {
        if (!player) return null;
        try {
            if (typeof player.isMute === 'function') return !!player.isMute();
        } catch (e) {}
        return null;
    }

    function updateMuteBtn() {
        if (!muteBtn) return;
        muteBtn.textContent = muted ? '🔊 取消静音' : '🔇 静音';
        muteBtn.classList.toggle('is-muted', muted);
    }

    function toggleMute() {
        if (!player) {
            tip('播放器未启动，先点播放再静音', true);
            return;
        }

        var want = !muted;
        var applied = applyMute(want);

        if (!applied) {
            tip('当前播放器版本没有 mute / setVolume 方法，无法控制音量', true);
            return;
        }

        muted = want;
        try { localStorage.setItem(CFG.storeMute, muted ? '1' : '0'); } catch (e) {}
        updateMuteBtn();

        var real = readRealMute();
        if (real !== null && real !== muted) {
            muted = real;
            updateMuteBtn();
            tip('音量控制未生效（' + (real ? '仍为静音' : '仍非静音') + '），可能是流本身没有音轨', true);
            return;
        }

        if (!muted && hasAudio === false) {
            tip('已取消静音，但这条流没有音轨，所以听不到声音', true);
            return;
        }

        tip(muted ? '已静音' : (hasAudio === false ? '已取消静音（该流无音轨）' : '已取消静音'));
    }

    function bindEvents() {
        player.on('load', function () {
            retryCount = 0;
            setStatus('playing', '播放中');
            tip('✅ 直播流已加载');

            if (muted) applyMute(true);
            updateMuteBtn();

            setTimeout(function () {
                try { if (player && typeof player.resize === 'function') player.resize(); } catch (e) {}
            }, 150);
        });

        player.on('play', function () {
            setStatus('playing', '播放中');
            if (muted) applyMute(true);
        });

        player.on('error', handleError);

        player.on('timeout', function () {
            console.warn('[事件] 流超时');
            setStatus('error', '流超时');
            tip('⚠️ 连接超时，播放器将尝试重连', true);
            if (!manualStop) scheduleRetry();
        });

        player.on('audioInfo', function (info) {
            hasAudio = true;
            console.log('[事件] 音频信息', info);
        });

        player.on('videoInfo', function (info) { console.log('[事件] 视频信息', info); });
        player.on('loadmetadata', function () { console.log('[事件] 已获取流元信息'); });

        clearTimeout(audioTimer);
        audioTimer = setTimeout(function () {
            if (hasAudio === null) {
                hasAudio = false;
                console.warn('[音频] 未收到音轨信息，判定该流无音频');
            }
        }, CFG.audioWait);
    }

    async function startPlay(url, isRetry) {
        url = (url || '').trim();

        if (!url) { tip('❌ 请输入有效的直播流地址', true); return; }
        if (typeof Jessibuca === 'undefined') {
            setStatus('error', '库加载失败');
            tip('❌ Jessibuca 未加载，请检查 ./js/jessibuca_v3.3.21.js 路径', true);
            return;
        }

        manualStop = false;
        if (!isRetry) retryCount = 0;

        var tk = parseAuthKey(url);
        if (tk && tk.expired) tip('⚠️ 该链接 auth_key 已于 ' + tk.text + ' 过期，播放大概率直接 403', true);

        var seq = ++playSeq;

        currentUrl = url;
        urlInput.value = url;
        try { localStorage.setItem(CFG.storeKey, url); } catch (e) {}

        hardReset();
        setStatus('connecting', isRetry ? ('重连中 ' + retryCount + '/' + CFG.maxRetry) : '正在加载解码器...');

        await sleep(CFG.rebuildGap);
        if (seq !== playSeq) return;

        freshContainer();

        try {
            player = new Jessibuca({
                container: containerEl,
                autoplay: true,
                isResize: true,
                useMSE: false,
                useWCS: false,
                videoBuffer: 0.2,
                supportDblclickFullscreen: true,
                loadingText: '加载中...',
                decoder: CFG.decoderJs,
                decodingPath: CFG.decodingDir,
                showBandwidth: true,
                controlAutoHide: true,
                heartTimeout: 30,
                heartTimeoutReplay: true,
                retryTimeout: 3000,
                retryMaxTimes: 3,
                isNotMute: !muted,
                debug: false,
                operateBtns: {
                    fullscreen: true,
                    screenshot: false,
                    play: true,
                    audio: true,
                    recorder: false
                }
            });

            bindEvents();
            updateMuteBtn();

            if (seq !== playSeq) { hardReset(); return; }

            if (typeof player.play === 'function') {
                var p = player.play(url);
                if (p && typeof p.catch === 'function') {
                    p.catch(function (e) {
                        console.warn('play() 调用失败', e);
                        handleError(normalizeError(e).raw || e);
                    });
                }
            }
        } catch (e) {
            console.error('初始化播放器异常', e);
            var msg = (e && e.message) ? e.message : String(e);

            if (/already|created|can not be created/i.test(msg)) {
                console.warn('容器标记残留，强制换节点后重试');
                hardReset();
                await sleep(CFG.rebuildGap);
                if (seq !== playSeq) return;
                freshContainer();
                try {
                    player = new Jessibuca({
                        container: containerEl,
                        autoplay: true,
                        isResize: true,
                        useMSE: false,
                        useWCS: false,
                        videoBuffer: 0.2,
                        loadingText: '加载中...',
                        decoder: CFG.decoderJs,
                        decodingPath: CFG.decodingDir,
                        heartTimeout: 30,
                        heartTimeoutReplay: true,
                        retryTimeout: 3000,
                        retryMaxTimes: 3,
                        isNotMute: !muted,
                        debug: false
                    });
                    bindEvents();
                    updateMuteBtn();
                    if (typeof player.play === 'function') player.play(url);
                    return;
                } catch (e2) {
                    msg = (e2 && e2.message) ? e2.message : String(e2);
                }
            }

            setStatus('error', '初始化失败');
            showPlaceholder('播放器初始化失败，请检查 decoder.js / decoder.wasm 路径');
            tip('初始化异常: ' + msg, true);
        }
    }

    function stopPlay() {
        manualStop = true;
        retryCount = 0;
        playSeq++;
        hardReset();
        currentUrl = '';
        freshContainer();
        showPlaceholder('播放已停止');
        setStatus('idle', '已停止');
    }

    async function pasteFromClipboard() {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
            tip('当前环境不支持一键粘贴，请手动 Ctrl+V', true);
            urlInput.focus();
            return;
        }
        try {
            var text = (await navigator.clipboard.readText() || '').trim();
            if (!text) { tip('📭 剪贴板为空', true); return; }
            urlInput.value = text;
            urlInput.dispatchEvent(new Event('input', { bubbles: true }));
            urlInput.focus();
            urlInput.setSelectionRange(text.length, text.length);
            startPlay(text);
        } catch (err) {
            var msg = '无法读取剪贴板，请手动粘贴';
            if (err && err.name === 'NotAllowedError') msg = '🔒 剪贴板权限被拒，请手动 Ctrl+V';
            if (err && err.name === 'SecurityError') msg = '🔒 需要 HTTPS 或 localhost 才能读剪贴板';
            tip(msg, true);
            urlInput.focus();
        }
    }

    function init() {
        var param = new URLSearchParams(location.search).get('url');
        if (param) {
            urlInput.value = param;
        } else {
            try {
                var last = localStorage.getItem(CFG.storeKey);
                if (last) urlInput.value = last;
            } catch (e) {}
        }

        try {
            if (localStorage.getItem(CFG.storeMute) === '1') muted = true;
        } catch (e) {}
        updateMuteBtn();

        showPlaceholder('请输入 FLV / WS 地址后点击播放');
        setStatus('idle', '待机');

        playBtn.addEventListener('click', function () { startPlay(urlInput.value); });
        stopBtn.addEventListener('click', stopPlay);
        muteBtn.addEventListener('click', toggleMute);
        diagBtn.addEventListener('click', diagnose);

        if (pasteBtn) {
            pasteBtn.setAttribute('title', '从剪贴板粘贴地址并直接播放');
            pasteBtn.addEventListener('click', function (e) {
                e.preventDefault();
                pasteFromClipboard();
            });
        }

        urlInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); startPlay(urlInput.value); }
        });

        if (location.protocol === 'file:') {
            var warn = document.createElement('div');
            warn.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#f59e0b;' +
                'color:#000;padding:8px 14px;border-radius:20px;font-size:11px;' +
                'font-weight:bold;z-index:9999;max-width:80vw;line-height:1.6;';
            warn.textContent = '⚠️ file:// 协议会让 wasm 和跨域请求失效，请用 http-server 启动本地服务';
            document.body.appendChild(warn);
        }

        window.addEventListener('beforeunload', function () {
            try { if (player) player.destroy(); } catch (e) {}
        });
    }

    init();
})();
</script>
</body>
</html>
