<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jessibuca FLV播放器 - 自定义URL (支持一键粘贴)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e1a;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-card {
            max-width: 1200px;
            width: 100%;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .video-area {
            position: relative;
		    /*position: absolute;*/
            /*background: #000;
            width: 100%;
            aspect-ratio: 16 / 9;*/
		    pointer-events: auto;
		    transform: translate(0px, 0px);
		    width: 430px;
		    height: 800px;
		    margin: 0 auto;

		    flex-shrink: 0;  /* 防止被压缩 */
        }

        #jessibuca-container {
            width: 100%;
            height: 100%;
        }

        .controls-bar {
            background: rgba(16, 20, 30, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .url-input-wrapper {
            flex: 4;
            min-width: 240px;
            display: flex;
            background: #0f111a;
            border-radius: 60px;
            border: 1px solid #2a2f42;
            transition: all 0.2s;
        }

        .url-input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        /* 左侧原始标签: 播放地址 */
        .url-label {
            padding: 0 18px;
            color: #8b95b5;
            font-size: 13px;
            font-weight: 500;
            line-height: 44px;
            background: #1a1e2c;
            border-radius: 60px 0 0 60px;
            border-right: 1px solid #2a2f42;
            white-space: nowrap;
        }

        /* 新增的粘贴标签: 完全复用原标签样式，位于右侧，圆角相反 */
        .paste-label {
            padding: 0 18px;
            color: #8b95b5;
            font-size: 13px;
            font-weight: 500;
            line-height: 44px;
            background: #1a1e2c;
            border-radius: 0 60px 60px 0;
            border-left: 1px solid #2a2f42;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .paste-label:hover {
            background: #252b40;
            color: #cdd6f4;
            border-left-color: #3e455e;
        }

        .paste-label:active {
            background: #10141f;
            transform: scale(0.97);
        }

        #streamUrl {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0 16px;
            height: 44px;
            color: #f0f3fa;
            font-size: 13px;
            font-family: monospace;
            outline: none;
            min-width: 0; /* 防止flex溢出 */
        }

        #streamUrl::placeholder {
            color: #4a516e;
            font-family: system-ui;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0 20px;
            height: 44px;
            border-radius: 44px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1e2538;
            color: #e2e8ff;
            border: 1px solid #323a52;
        }

        .btn-primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: scale(0.97);
        }

        .btn-danger {
            background: #dc2626;
            border-color: #dc2626;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-warning {
            background: #f59e0b;
            border-color: #f59e0b;
            color: #1e1b12;
        }

        .status-area {
            background: #0b0e16;
            border-radius: 40px;
            padding: 5px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            border: 1px solid #292f42;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 10px;
            background: #5b6380;
        }

        .led.green {
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }

        .led.red {
            background: #ef4444;
        }

        .led.yellow {
            background: #eab308;
        }

        .status-text {
            color: #bfc9f0;
            font-family: monospace;
        }

        .footer-tip {
            font-size: 11px;
            text-align: center;
            padding: 10px;
            color: #5a6382;
            background: #05070c;
            border-top: 1px solid #181e2c;
        }

        /* 轻提示toast样式 (非阻塞友好提示) */
        .toast-message {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e253ecc;
            backdrop-filter: blur(12px);
            color: #c0d0ff;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #3d4570;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            font-family: monospace;
            white-space: nowrap;
            max-width: 90vw;
            white-space: normal;
            word-break: break-all;
            text-align: center;
        }
        .toast-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 700px) {
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group {
                justify-content: center;
            }
            .toast-message {
                font-size: 11px;
                bottom: 70px;
            }
        }
    </style>
    <link rel="icon" href="data:,">
</head>
<body>

<div class="player-card">
    <div class="video-area">
        <div id="jessibuca-container"></div>
    </div>

    <div class="controls-bar">
        <div class="url-input-wrapper">
            <span class="url-label">🎬 播放地址</span>
            <input type="text" id="streamUrl" placeholder="例如: http://xxx.xxx/live/stream.flv 或 ws://..." value="">
            <!-- 新增粘贴标签 样式与左侧完全一致，圆角方向为右侧圆角 -->
            <span class="paste-label" id="pasteUrlBtn">
                粘贴地址
            </span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="playBtn">▶ 播放</button>
            <button class="btn btn-danger" id="stopBtn">⏹ 停止</button>
            <button class="btn btn-warning" id="muteBtn">🔇 静音</button>
        </div>
        <div class="status-area">
            <div class="led" id="statusLed"></div>
            <span class="status-text" id="statusMsg">待机</span>
        </div>
    </div>
    <div class="footer-tip">
        📌 支持 FLV (HTTP/HTTPS/WS)  |  解码器: jessibuca + decoder.wasm  |  💡 点击「粘贴」按钮快速填入剪贴板地址
    </div>
</div>

<!-- 轻提示容器 -->
<div id="toastMsg" class="toast-message">📋 提示信息</div>
<script src="./js/jessibuca_v3.3.21.js"></script>
<script>
    // ============================================================
    // 本地文件结构:
    //   jessibuca/
    //     js/
    //       jessibuca_v3.3.21.js
    //       decoder.js
    //       decoder.wasm
    //
    // 使用方法:
    //   1. 将上述文件和 index.html 放在合适目录 (保持相对路径)
    //   2. 用 http-server / live-server 启动本地服务 (不要用 file:// 协议)
    //   3. 在输入框填入 flv 直播地址, 点击播放
    // ============================================================

    let player = null;
    let isMutedFlag = false;
    let currentUrl = '';

    // DOM 元素
    const container = document.getElementById('jessibuca-container');
    const urlInput = document.getElementById('streamUrl');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const muteBtn = document.getElementById('muteBtn');
    const statusLed = document.getElementById('statusLed');
    const statusMsg = document.getElementById('statusMsg');
    const pasteBtn = document.getElementById('pasteUrlBtn');   // 新增粘贴按钮
    const toastEl = document.getElementById('toastMsg');

    // 显示浮动提示 (复用toast)
    function showToast(msg, isError = false) {
        if (!toastEl) return;
        toastEl.textContent = msg || (isError ? '❌ 操作失败' : '✓ 完成');
        if (isError) {
            toastEl.style.background = '#dc2626cc';
            toastEl.style.color = '#fff0e0';
            toastEl.style.borderColor = '#ff8a6f';
        } else {
            toastEl.style.background = '#1e253ecc';
            toastEl.style.color = '#c0d0ff';
            toastEl.style.borderColor = '#3d4570';
        }
        toastEl.classList.add('show');
        setTimeout(() => {
            toastEl.classList.remove('show');
            // 重置背景风格
            setTimeout(() => {
                if (!isError) {
                    toastEl.style.background = '#1e253ecc';
                    toastEl.style.color = '#c0d0ff';
                    toastEl.style.borderColor = '#3d4570';
                }
            }, 200);
        }, 2000);
    }

    // 旧版 showTip 兼容 (统一使用toast)
    function showTip(msg, isError = false) {
        showToast(msg, isError);
    }

    // 更新状态指示器
    function setStatus(state, msg) {
        statusMsg.innerText = msg;
        statusLed.className = 'led';
        if (state === 'connecting') {
            statusLed.classList.add('yellow');
        } else if (state === 'playing') {
            statusLed.classList.add('green');
        } else if (state === 'error') {
            statusLed.classList.add('red');
        } else {
            // idle
        }
    }

    // 销毁播放器实例 (彻底清理)
    function destroyPlayer() {
        if (player) {
            try {
                // 先暂停播放
                if (typeof player.pause === 'function') {
                    player.pause();
                }
                // 再销毁
                player.destroy();
                const containerRef = player.getContainer ? player.getContainer() : null;
                if (containerRef && containerRef.parentNode) {
                    // 只是确保不残留; 因为外层已经手动清空container, 但以防万一
                }
            } catch (e) {
                console.warn('销毁异常', e);
            }
            player = null;
        }
    }

    // 显示占位黑底
    function showPlaceholder(text = '等待播放') {
        destroyPlayer();
        // 清空容器所有子节点
        while (container.firstChild) {
            container.removeChild(container.firstChild);
        }
        const placeholder = document.createElement('div');
        placeholder.style.width = '100%';
        placeholder.style.height = '100%';
        placeholder.style.backgroundColor = '#0a0e18';
        placeholder.style.display = 'flex';
        placeholder.style.alignItems = 'center';
        placeholder.style.justifyContent = 'center';
        placeholder.style.flexDirection = 'column';
        placeholder.style.gap = '12px';
        placeholder.style.color = '#6a729b';
        placeholder.style.fontSize = '14px';
        placeholder.innerHTML = `
            <div style="font-size: 48px;">📺</div>
            <div>${text}</div>
            <div style="font-size: 11px;">Jessibuca 解码器待命</div>
        `;
        container.appendChild(placeholder);
        setStatus('idle', '已停止');
    }

    // 核心: 初始化并播放指定URL
    async function startPlay(url) {
        if (!url || url.trim() === '') {
            showTip('❌ 请输入有效的直播流地址', true);
            return false;
        }

        if (typeof Jessibuca === 'undefined') {
            showTip('❌ Jessibuca 库加载失败，请检查js路径', true);
            setStatus('error', '库加载失败');
            return false;
        }

        // 🔥 完全销毁旧播放器
        if (player) {
            destroyPlayer();
        }

        // 🔥 清空容器 (确保干净)
        while (container.firstChild) {
            container.removeChild(container.firstChild);
        }
        container.innerHTML = '';
        
        // 短暂延迟，确保DOM完全重置
        await new Promise(resolve => setTimeout(resolve, 50));

        setStatus('connecting', '正在加载解码器...');
        showTip('初始化 Jessibuca + decoder.wasm ...');

        try {
            const options = {
                container: container,
                url: url.trim(),
                autoplay: true,
                useWebFullScreen: false,
                isResize: true,
                supportDblclickFullscreen: true,
                loadingText: '加载中...',
                decodingPath: './js/',
                decoder: './js/decoder.js',
                showBandwidth: true, // 显示网速
                operateBtns: {
                    fullscreen: true, //全屏按钮
                    screenshot: false,//截屏按钮
                    play: true,       //播放按钮
                    audio: true,      //音量按钮
                    recorder: false   //录制按钮
                },
                controlAutoHide: true, //自动隐藏工具栏
                wasmDecoding: true,
                heartTimeout: 30,
                heartTimeoutReplay: true,
                retryTimeout: 3000,
                retryMaxTimes: 3,
                debug: false,
                muted: isMutedFlag,
            };

            // 🔥 创建新实例
            player = new Jessibuca(options);

            player.on('load', () => {
                console.log('[事件] 流加载成功');
                setStatus('playing', '播放中');
                showTip('✅ 直播流已加载');
            });

            player.on('play', () => {
                console.log('[事件] 开始播放');
                setStatus('playing', '播放中');
                if (player && isMutedFlag && typeof player.mute === 'function') {
                    player.mute(true);
                }
            });

            player.on('error', (err) => {
                console.error('[事件] 播放错误', err);
                setStatus('error', '错误');
                let errMsg = typeof err === 'string' ? err : (err?.message || JSON.stringify(err));
                showTip(`❌ 播放错误: ${errMsg.substring(0, 100)}`, true);
            });

            player.on('timeout', () => {
                console.warn('[事件] 流超时');
                setStatus('error', '流超时');
                showTip('⚠️ 连接超时，播放器将尝试重连', true);
            });

            player.on('loadmetadata', () => {
                console.log('[事件] 获取到流信息');
            });

            // 延迟调用播放
            setTimeout(() => {
                if (player && typeof player.play === 'function') {
                    player.play(url.trim()).catch(e => {
                        console.warn('play()调用失败', e);
                        setStatus('error', '播放失败');
                        showTip('播放失败: ' + (e.message || '未知错误'), true);
                    });
                }
            }, 150);

            return true;
        } catch (err) {
            console.error('初始化播放器异常:', err);
            setStatus('error', '初始化失败');
            showTip(`初始化异常: ${err.message}`, true);
            showPlaceholder('播放器初始化失败，请重试');
            return false;
        }
    }

    // 停止播放
    function stopPlay() {
        if (player) {
            try {
                player.destroy();
                destroyPlayer();
            } catch (e) {
                console.warn(e);
            }
            player = null;
        }
        showPlaceholder('播放已停止');
        currentUrl = '';
    }

    // 静音切换
    function toggleMute() {
        if (!player) {
            showTip('播放器未启动，无法静音', true);
            return;
        }
        isMutedFlag = !isMutedFlag;
        if (typeof player.mute === 'function') {
            player.mute(isMutedFlag);
            muteBtn.innerHTML = isMutedFlag ? '🔊 取消静音' : '🔇 静音';
            showTip(isMutedFlag ? '已静音' : '已取消静音');
        } else {
            showTip('当前版本不支持 mute 方法', true);
        }
    }

    // 播放按钮逻辑
    async function onPlayClick() {
        const url = urlInput.value.trim();
        if (!url) {
            showTip('请在输入框中填写直播流地址 (例如 http://xxx.flv)', true);
            return;
        }
        currentUrl = url;
        await startPlay(url);
    }

    // ================= 新增核心功能: 粘贴按钮 =================
    // 点击「粘贴」按钮时，从系统剪贴板读取文本，并填入地址栏，同时可选自动播放（不自动播放，只填入，由用户决定是否播放）
    async function handlePasteToInput() {
        // 检查剪贴板API可用性
        if (!navigator.clipboard || !navigator.clipboard.readText) {
            // 降级: 提示用户使用 Ctrl+V 手动粘贴
            showTip('⚠️ 当前浏览器不支持一键粘贴，请手动复制后按 Ctrl+V', true);
            // 让输入框获得焦点，方便用户直接Ctrl+V
            urlInput.focus();
            return;
        }

        try {
            const clipboardText = await navigator.clipboard.readText();
            if (clipboardText && clipboardText.trim() !== "") {
                const pastedValue = clipboardText.trim();
                // 更新输入框的值
                urlInput.value = pastedValue;
                // 触发 input 事件，便于其他监听
                urlInput.dispatchEvent(new Event('input', { bubbles: true }));
                // 显示成功提示，并展示简略内容
                let displayShort = pastedValue.length > 55 ? pastedValue.substring(0, 52) + '...' : pastedValue;
                //showTip(`✅ 已粘贴: ${displayShort}`, false);
                // 将光标置于末尾
                urlInput.focus();
                urlInput.setSelectionRange(urlInput.value.length, urlInput.value.length);
                //自动播放
                onPlayClick();
                // 可选: 自动播放？不自动播放，仅填充，尊重用户操作习惯；但也可加个额外提醒
                // 如果当前播放器没在播放且希望快速测试，用户可以点击播放按钮
            } else {
                showTip('📭 剪贴板为空，请先复制直播地址', true);
            }
        } catch (err) {
            console.warn('读取剪贴板失败: ', err);
            let errorMsg = '❌ 无法访问剪贴板，请检查权限或手动粘贴';
            if (err.name === 'NotAllowedError') {
                errorMsg = '🔒 需要授权剪贴板权限，请手动粘贴 (Ctrl+V)';
            } else if (err.name === 'SecurityError') {
                errorMsg = '🔒 安全限制，请使用 HTTPS 或本地测试服务器';
            }
            showTip(errorMsg, true);
            // 降级让用户手动粘贴
            urlInput.focus();
        }
    }

    // 页面初始化占位
    function initPlaceholder() {
        showPlaceholder('请输入 FLV/WS 地址开始播放');
        // 预设示例为空，让用户输入
        urlInput.value = '';
        setStatus('idle', '待机');
    }

    // 事件绑定
    playBtn.addEventListener('click', onPlayClick);
    stopBtn.addEventListener('click', stopPlay);
    muteBtn.addEventListener('click', toggleMute);
    
    // 粘贴按钮事件绑定 (关键新增)
    if (pasteBtn) {
        pasteBtn.addEventListener('click', (e) => {
            e.preventDefault();
            handlePasteToInput();
        });
        // 添加悬停提示
        pasteBtn.setAttribute('title', '从剪贴板粘贴地址到输入框');
    }
    
    // 输入框回车快捷播放
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            onPlayClick();
        }
    });
    
    // 检测 file:// 协议警告
    if (window.location.protocol === 'file:') {
        const warn = document.createElement('div');
        warn.style.position = 'fixed';
        warn.style.bottom = '20px';
        warn.style.right = '20px';
        warn.style.backgroundColor = '#f59e0b';
        warn.style.color = '#000';
        warn.style.padding = '6px 14px';
        warn.style.borderRadius = '20px';
        warn.style.fontSize = '11px';
        warn.style.fontWeight = 'bold';
        warn.style.zIndex = '9999';
        warn.innerHTML = '⚠️ file:// 协议限制网络请求，请使用 http-server 启动本地服务';
        document.body.appendChild(warn);
    }

    // 额外增加一个小功能: 如果粘贴后自动高亮或微提示，已经实现。
    // 兼容手机端长按粘贴? 保留原生行为的同时按钮给予更多便利。
    // 启动
    initPlaceholder();
</script>
</body>
</html>
